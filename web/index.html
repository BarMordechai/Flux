<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<title>שטף</title>
<style>
  :root { --bg:#f6f7f7; --card:#fff; --ink:#1b1f1f; --muted:#5d6666; --accent:#0f766e; --accent-ink:#fff; --line:#dfe3e3; --rec:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111515; --card:#1a2020; --ink:#e8eded; --muted:#9aa5a5; --accent:#2dd4bf; --accent-ink:#062421; --line:#2b3434; --rec:#fb923c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.5rem; margin:4px 0 2px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
  .rec { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #recBtn { width:96px; height:96px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); font-size:1rem; font-weight:600; cursor:pointer; }
  #recBtn.on { background:var(--rec); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  #timer { font-variant-numeric:tabular-nums; color:var(--muted); }
  .seg { display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .seg button { flex:1; padding:10px; border:0; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
  .seg button.sel { background:var(--accent); color:var(--accent-ink); font-weight:600; }
  .hint { color:var(--muted); font-size:.9rem; margin:8px 0 0; }
  label.file { display:block; text-align:center; color:var(--accent); cursor:pointer; margin-top:6px; }
  audio { width:100%; margin:6px 0 12px; }
  .row { display:flex; gap:10px; }
  .btn { flex:1; padding:12px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--accent); }
  .btn:disabled { opacity:.5; }
  #summary { margin:0 0 8px; }
  #status { min-height:1.5em; color:var(--muted); text-align:center; }
  .hidden { display:none; }
  details { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>שטף</h1>
  <p class="sub">מקליטים הודעה, האפליקציה מחליקה חזרות, הארכות וחסימות בקול שלך, ושולחים לוואטסאפ.</p>

  <div class="card">
    <div class="seg" role="radiogroup" aria-label="רמת החלקה">
      <button data-mode="gentle" class="sel" role="radio" aria-checked="true">החלקה עדינה</button>
      <button data-mode="full" role="radio" aria-checked="false">החלקה מלאה</button>
    </div>
    <p class="hint" id="modeHint">משאירה מעט חוסר שטף טבעי, כדי שההודעה תישמע כמוך.</p>
  </div>

  <div class="card rec">
    <button id="recBtn" aria-label="הקלטה">הקלטה</button>
    <div id="timer">0:00</div>
    <label class="file">או לבחור קובץ שמע<input id="fileIn" type="file" accept="audio/*,.opus,.ogg" hidden></label>
  </div>

  <div id="status" role="status"></div>

  <div class="card hidden" id="result">
    <p id="summary"></p>
    <div>אחרי החלקה</div>
    <audio id="after" controls></audio>
    <div class="row">
      <button class="btn" id="shareBtn">שליחה לוואטסאפ</button>
      <button class="btn ghost" id="dlBtn">הורדה</button>
    </div>
    <details>
      <summary>ההקלטה המקורית ופירוט</summary>
      <audio id="before" controls></audio>
      <div id="details"></div>
    </details>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let mode = "gentle", recorder = null, chunks = [], t0 = 0, tick = null, outBlob = null;
const HINT = { gentle: "משאירה מעט חוסר שטף טבעי, כדי שההודעה תישמע כמוך.", full: "מסירה כמה שיותר חזרות, הארכות וחסימות." };
const NAMES = { repetition: "חזרות", prolongation: "הארכות", block: "חסימות", pause: "הפסקות ארוכות" };

document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".seg button").forEach((x) => { x.classList.toggle("sel", x === b); x.setAttribute("aria-checked", x === b); });
  mode = b.dataset.mode; $("modeHint").textContent = HINT[mode];
});

$("recBtn").onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) { status("אין גישה למיקרופון. צריך לאשר הרשאה (והאתר חייב לרוץ ב-HTTPS)."); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(tick); $("recBtn").classList.remove("on"); $("recBtn").textContent = "הקלטה";
    send(new Blob(chunks, { type: recorder.mimeType }), "recording");
  };
  recorder.start();
  t0 = Date.now(); $("recBtn").classList.add("on"); $("recBtn").textContent = "עצירה";
  tick = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 250);
};

$("fileIn").onchange = (e) => { const f = e.target.files[0]; if (f) send(f, f.name); e.target.value = ""; };

function status(msg) { $("status").textContent = msg; }

async function send(blob, name) {
  $("result").classList.add("hidden");
  $("before").src = URL.createObjectURL(blob);
  status("מעבד את ההקלטה...");
  const fd = new FormData();
  fd.append("file", blob, name); fd.append("mode", mode); fd.append("fmt", "ogg");
  try {
    const r = await fetch("api/process", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const j = await r.json();
    const bytes = Uint8Array.from(atob(j.audio), (c) => c.charCodeAt(0));
    outBlob = new Blob([bytes], { type: j.mime });
    $("after").src = URL.createObjectURL(outBlob);
    show(j.report);
    status("");
  } catch (e) { status("העיבוד נכשל: " + e.message); }
}

function show(rep) {
  const parts = Object.entries(rep.counts).filter(([k]) => NAMES[k]).map(([k, v]) => `${v} ${NAMES[k]}`);
  $("summary").textContent = parts.length
    ? `הוחלקו ${parts.join(", ")}. ${rep.original_seconds} שניות הפכו ל-${rep.output_seconds}.`
    : "לא נמצא מה להחליק, ההודעה נשארה כמו שהיא.";
  $("details").innerHTML = "";
  for (const e of rep.events.filter((e) => NAMES[e.kind])) {
    const d = document.createElement("div");
    d.textContent = `${NAMES[e.kind]}: מ-${e.start.toFixed(1)} עד ${e.end.toFixed(1)} שנ׳`;
    $("details").append(d);
  }
  if (rep.transcript) { const d = document.createElement("div"); d.textContent = "תמלול: " + rep.transcript; $("details").append(d); }
  $("result").classList.remove("hidden");
}

$("shareBtn").onclick = async () => {
  const file = new File([outBlob], "voice-message.ogg", { type: "audio/ogg" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) { /* user cancelled */ }
  } else {
    download(); status("הקובץ ירד למכשיר. אפשר לצרף אותו בוואטסאפ דרך 📎.");
  }
};
$("dlBtn").onclick = download;
function download() {
  const a = document.createElement("a"); a.href = URL.createObjectURL(outBlob); a.download = "voice-message.ogg"; a.click();
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
