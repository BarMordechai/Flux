name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Point the app at the processing server (the Hugging Face Space of the HF_TOKEN owner).
      - name: Server URL
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            user=$(curl -sf -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 | python3 -c "import json,sys;print(json.load(sys.stdin)['name'])")
            echo "SHETEF_SERVER_URL=https://$(echo "$user" | tr 'A-Z_' 'a-z-')-shetef.hf.space" >> "$GITHUB_ENV"
          fi
          echo "SHETEF_API_KEY=${{ secrets.FLUENCY_API_KEY || 'shetef-mvp-3f9c1a' }}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "shetef-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shetef-apk
          path: shetef-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" shetef-*.apk \
            --title "שטף 0.1.${{ github.run_number }}" \
            --notes "להתקנה: להוריד את קובץ ה-APK בטלפון ולפתוח אותו (יש לאשר התקנה ממקור לא ידוע)."
