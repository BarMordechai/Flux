name: Calibrate on SEP-28k

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "How many podcast episodes to download and score"
        default: "40"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install numpy
      - name: Calibrate
        run: python tools/calibrate_sep28k.py --episodes "${{ inputs.episodes }}" --out report
      - run: cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: calibration-report
          path: report/
      - name: Save report to the calibration-reports branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          dir="reports/run-${{ github.run_number }}"
          mkdir -p "/tmp/$dir" && cp report/* "/tmp/$dir/"
          git fetch origin calibration-reports || true
          if git rev-parse --verify origin/calibration-reports >/dev/null 2>&1; then
            git checkout -B calibration-reports origin/calibration-reports
          else
            git checkout --orphan calibration-reports && git rm -rfq .
          fi
          mkdir -p "$dir" && cp "/tmp/$dir"/* "$dir/"
          git add reports && git commit -qm "Calibration report, run ${{ github.run_number }}"
          git push origin calibration-reports
