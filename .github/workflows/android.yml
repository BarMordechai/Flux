name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "shetef-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shetef-apk
          path: shetef-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" shetef-*.apk \
            --title "שטף 0.1.${{ github.run_number }}" \
            --notes "להתקנה: להוריד את קובץ ה-APK בטלפון ולפתוח אותו (יש לאשר התקנה ממקור לא ידוע)."
