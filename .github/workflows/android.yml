name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The on-device Hebrew CTC model is exported from Hugging Face at build time (too big for git).
      - name: Cache exported model
        id: model
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/assets/ctc.onnx
            android/app/src/main/assets/ctc.json
          key: ctc-${{ hashFiles('tools/export_onnx.py', 'fluency/ctc.py') }}

      - uses: actions/setup-python@v5
        if: steps.model.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Export model to ONNX
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers onnx onnxruntime numpy
          python tools/export_onnx.py --out android/app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "shetef-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shetef-apk
          path: shetef-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" shetef-*.apk \
            --title "שטף 0.1.${{ github.run_number }}" \
            --notes "להתקנה: להוריד את קובץ ה-APK בטלפון ולפתוח אותו (יש לאשר התקנה ממקור לא ידוע)."
